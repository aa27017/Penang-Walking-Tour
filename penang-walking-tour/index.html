<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ジョージタウン歴史散策</title>
  <meta name="description" content="ペナン島ジョージタウン（世界遺産地区）の歴史スポットを日本語の解説付きで歩いて回るウォーキングツアーアプリ">
  <meta name="theme-color" content="#0b5d63" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a1c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GT散策">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="app-title" id="appTitle">ジョージタウン歴史散策</h1>
      <div class="mode-switch" role="radiogroup" aria-label="表示モード">
        <button type="button" role="radio" data-mode="adult" aria-checked="true">おとな</button>
        <button type="button" role="radio" data-mode="kids" aria-checked="false">こども</button>
      </div>
    </div>
  </header>

  <div id="proxBanner" class="prox-banner" hidden role="status" aria-live="polite"></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <main id="main">
    <!-- 地図 -->
    <section id="view-map" class="view" data-view="map">
      <div id="map" aria-label="地図"></div>
      <div class="map-fabs">
        <button type="button" class="fab" id="btnLocate" aria-label="現在地を表示">◎</button>
        <button type="button" class="fab" id="btnFit" aria-label="ルート全体を表示">⤢</button>
      </div>
      <div class="next-card" id="mapNext"></div>
    </section>

    <!-- ツアー -->
    <section id="view-tour" class="view scroll" data-view="tour" hidden>
      <div class="pad">
        <div class="course-chips" id="courseChips" role="tablist" aria-label="コース"></div>
        <div id="courseInfo" class="course-info"></div>
        <div id="tourNow"></div>
        <div id="stampPanel"></div>
        <h2 class="section-h" id="stopListTitle">ルート</h2>
        <ol class="stop-list" id="stopList"></ol>
      </div>
    </section>

    <!-- 用語集 -->
    <section id="view-glossary" class="view scroll" data-view="glossary" hidden>
      <div class="pad">
        <h2 class="section-h">用語集</h2>
        <input type="search" id="glossarySearch" class="search" placeholder="ことばを検索" aria-label="用語を検索">
        <dl id="glossaryList" class="glossary"></dl>
      </div>
    </section>

    <!-- 実用情報・設定 -->
    <section id="view-info" class="view scroll" data-view="info" hidden>
      <div class="pad">
        <div id="infoSections"></div>
        <h2 class="section-h">設定</h2>
        <div class="card settings">
          <label class="row-toggle">
            <span>
              <strong>近づいたら知らせる</strong><br>
              <small>スポットの約50m以内に来るとバナーを表示します</small>
            </span>
            <input type="checkbox" id="toggleProx" class="switch">
          </label>
          <hr>
          <div>
            <strong>オフライン用に地図を保存</strong><br>
            <small id="tileInfo">ツアー範囲の地図（ズーム14〜17）を端末に保存します。Wi-Fi接続時がおすすめです。</small>
            <div class="progress" id="tileProgress" hidden><div class="bar"></div></div>
            <div class="btn-row">
              <button type="button" class="btn primary" id="btnTiles">地図を保存</button>
              <button type="button" class="btn" id="btnTilesClear">保存した地図を削除</button>
            </div>
          </div>
          <hr>
          <div>
            <strong>記録のリセット</strong><br>
            <small>訪問済み・スタンプ・壁画チェックを消します</small>
            <div class="btn-row"><button type="button" class="btn danger" id="btnReset">記録を消す</button></div>
          </div>
        </div>
        <h2 class="section-h">このアプリについて</h2>
        <div class="card small-text" id="aboutBox"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="メインメニュー">
    <button type="button" data-tab="map" aria-current="page"><span class="ti">🗺️</span><span class="tl" data-adult="地図" data-kids="ちず">地図</span></button>
    <button type="button" data-tab="tour"><span class="ti">🚶</span><span class="tl" data-adult="ツアー" data-kids="ツアー">ツアー</span></button>
    <button type="button" data-tab="glossary"><span class="ti">📖</span><span class="tl" data-adult="用語集" data-kids="ことば">用語集</span></button>
    <button type="button" data-tab="info"><span class="ti">ℹ️</span><span class="tl" data-adult="情報・設定" data-kids="じょうほう">情報・設定</span></button>
  </nav>

  <!-- スポット詳細シート -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button type="button" class="icon-btn" id="sheetClose" aria-label="閉じる">✕</button>
      <span class="sheet-num" id="sheetNum"></span>
      <button type="button" class="icon-btn" id="sheetSpeak" aria-label="読み上げ">🔊</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>

  <!-- 休憩カード／認定証などのモーダル -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
